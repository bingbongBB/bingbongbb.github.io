// ─── Hooks ────────────────────────────────────────────────────────────────────
function useTypingEffect(words, speed = 80, pause = 1800) {
  const [display, setDisplay] = useState("");
  const [wIdx, setWIdx] = useState(0);
  const [charIdx, setCharIdx] = useState(0);
  const [deleting, setDeleting] = useState(false);

  useEffect(() => {
    const word = words[wIdx];
    let timeout;
    if (!deleting && charIdx < word.length) {
      timeout = setTimeout(() => setCharIdx(c => c + 1), speed);
    } else if (!deleting && charIdx === word.length) {
      timeout = setTimeout(() => setDeleting(true), pause);
    } else if (deleting && charIdx > 0) {
      timeout = setTimeout(() => setCharIdx(c => c - 1), speed / 2);
    } else if (deleting && charIdx === 0) {
      setDeleting(false);
      setWIdx(i => (i + 1) % words.length);
    }
    setDisplay(word.slice(0, charIdx));
    return () => clearTimeout(timeout);
  }, [charIdx, deleting, wIdx, words, speed, pause]);

  return display;
}

function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
}

    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-box" onClick={e => e.stopPropagation()}>
        <button onClick={onClose} style={{ position: "absolute", top: 14, right: 14, background: "rgba(33,36,61,0.07)", border: "none", borderRadius: 8, width: 36, height: 36, cursor: "pointer", fontSize: 22, color: C.navy, lineHeight: 1, fontFamily: "'DM Sans',sans-serif" }}>×</button>
        <ItemIcon item={item} modal />
        <h2 style={{ margin: "0 0 3px", fontSize: 26, fontWeight: 800, color: C.navy, letterSpacing: "0" }}>{item.title || item.role}</h2>
        {(item.subtitle || item.company) && <p style={{ margin: "0 0 5px", fontSize: 16, color: C.blue, fontWeight: 600 }}>{item.subtitle || item.company}</p>}
        {item.period && <p style={{ margin: "0 0 18px", fontSize: 14.5, color: C.gray }}>{item.period}{item.location ? ` · ${item.location}` : ""}</p>}
        <div style={{ marginBottom: 18 }}>{tags.map(t => <Tag key={t} label={t} />)}</div>
        {item.description && <p style={{ fontSize: 16.5, color: C.navy, lineHeight: 1.65, margin: "0 0 22px", opacity: 0.86 }}>{item.description}</p>}
        {bullets.length > 0 && (
          <>
            <h4 style={{ margin: "0 0 10px", fontSize: 13, fontWeight: 700, color: C.blue, textTransform: "uppercase", letterSpacing: "0.08em" }}>{item.bullets ? "Achievements" : "Highlights"}</h4>
            <ul style={{ margin: 0, paddingLeft: 20, display: "flex", flexDirection: "column", gap: 8 }}>
              {bullets.map((b, i) => <li key={i} style={{ fontSize: 15.5, color: C.navy, lineHeight: 1.65, opacity: 0.86 }}>{b}</li>)}
            </ul>
          </>
        )}
        <div style={{ display: "flex", gap: 12, marginTop: 28 }}>
          {item.github && <a href={item.github} target="_blank" rel="noreferrer" style={{ padding: "12px 24px", borderRadius: 6, background: C.navy, color: C.white, textDecoration: "none", fontSize: 15, fontWeight: 700 }}>GitHub ↗</a>}
          {item.demo && <a href={item.demo} target="_blank" rel="noreferrer" style={{ padding: "12px 24px", borderRadius: 6, background: C.blue, color: C.white, textDecoration: "none", fontSize: 15, fontWeight: 700 }}>Live Demo ↗</a>}
        </div>
      </div>
    </div>
  );
}

// ─── Main ─────────────────────────────────────────────────────────────────────
function Portfolio() {

    const onScroll = () => {
      const doc = document.documentElement;
      const pct = (window.scrollY / (doc.scrollHeight - doc.clientHeight)) * 100;
      const bar = document.getElementById("scroll-progress");
      if (bar) bar.style.width = pct + "%";
      setNavScrolled(window.scrollY > 20);
    };
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const scrollTo = id => {
    const el = document.getElementById(id);
    if (!el) return;
    const y = el.getBoundingClientRect().top + window.scrollY - 80;
    window.scrollTo({ top: y, behavior: "smooth" });
  };

    { label: "About",      id: "about" },
    { label: "Experience", id: "experience" },

    { label: "Skills",     id: "skills" },
    { label: "Contact",    id: "contact" },

        </div>

      {/* HERO */}

            <h1 className="hero-name hero-in hero-in-2" style={{ margin: "0 0 10px", fontSize: 68, fontWeight: 900, color: C.navy, lineHeight: 1.02, letterSpacing: "0" }}>

      </footer>

      {selected && <Modal item={selected} onClose={() => setSelected(null)} />}
    </div>
  );
}
