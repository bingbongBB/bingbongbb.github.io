  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }
  html { scroll-behavior: smooth; }
  body { background: #fff; color: #21243D; font-family: 'DM Sans', 'Noto Sans TC', sans-serif; overflow-x: hidden; }
  section[id] { scroll-margin-top: 96px; }

  /* Scroll progress bar */
  #scroll-progress {
    position: fixed; top: 0; left: 0; height: 3px; z-index: 9999;
    background: linear-gradient(90deg, #789DBC, #C9E9D2);
    width: 0%; transition: width 0.1s linear;
  }

  /* Fade-in animation — only for below-the-fold elements */
  .reveal {
    opacity: 0.92;
    transform: translateY(8px);
    transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .reveal-delay-1 { transition-delay: 40ms; }
  .reveal-delay-2 { transition-delay: 80ms; }
  .reveal-delay-3 { transition-delay: 120ms; }
  .reveal-delay-4 { transition-delay: 160ms; }

  /* Hero elements animate in on load — not IntersectionObserver */
  @keyframes heroFadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hero-in {
    animation: heroFadeUp 300ms var(--ease-out) both;
  }
  .hero-in-1 { animation-delay: 30ms; }
  .hero-in-2 { animation-delay: 80ms; }
  .hero-in-3 { animation-delay: 120ms; }
  .hero-in-4 { animation-delay: 160ms; }
  .hero-in-5 { animation-delay: 200ms; }

  /* Tag pill */
  .tag {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 15px; font-weight: 600; letter-spacing: 0.04em;
    background: rgba(33,36,61,0.07);
    color: #21243D;
    margin: 4px 5px 4px 0;
    transition: background 0.2s, color 0.2s;
  }
  .tag.dark { background: #21243D; color: #fff; }

  /* Nav button base */
  .nav-btn {
    background: none; border: none; cursor: pointer;
    font-size: 15px; font-weight: 500; color: #21243D;
    padding: 0; transition: color 160ms var(--ease-out), transform 160ms var(--ease-out);
    font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
  }
  .nav-btn:active { transform: scale(0.97); }

  /* Card hover */
  .featured-card {
    background: #fff; border-radius: 8px; padding: 30px;
    cursor: pointer; flex: 1 1 360px;
    box-shadow: 0 2px 12px rgba(33,36,61,0.08);
    transition: transform 220ms var(--ease-out), box-shadow 220ms var(--ease-out);
  }
  .featured-card:active { transform: scale(0.99); }

  .exp-row {
    display: flex; gap: 28px; padding: 28px 0;
    border-bottom: 1px solid rgba(33,36,61,0.08);
    cursor: pointer; transition: background 160ms var(--ease-out), transform 160ms var(--ease-out);
    border-radius: 6px;
  }
  .exp-row:active { transform: scale(0.995); }

  .proj-row {
    display: flex; gap: 28px; align-items: flex-start;
    padding: 28px 0; cursor: pointer; transition: background 160ms var(--ease-out), transform 160ms var(--ease-out);
    border-radius: 6px;
  }
  .proj-row:active { transform: scale(0.995); }

  /* Skill dot */
  .skill-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #C9E9D2; flex-shrink: 0;
    transition: background 160ms var(--ease-out), transform 160ms var(--ease-out);
  }

  /* Hero gradient blob */
  .hero-blob {
    position: absolute; border-radius: 50%; filter: blur(72px);
    pointer-events: none; z-index: 0;
  }

  /* Modal backdrop */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(33,36,61,0.5);
    backdrop-filter: blur(6px);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    animation: fadeIn 180ms var(--ease-out);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-box {
    background: #fff; border-radius: 18px;
    padding: 44px 40px;
    max-width: 680px; width: 100%;
    max-height: 88vh; overflow-y: auto;
    box-shadow: 0 32px 80px rgba(33,36,61,0.24);
    position: relative;
    animation: slideUp 240ms var(--ease-out);
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(33,36,61,0.15); border-radius: 3px; }

  /* CTA buttons */
  .cta-primary {
    padding: 15px 36px; border-radius: 5px; border: none;
    background: #789DBC; color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
    transition: background 160ms var(--ease-out), transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
    box-shadow: 0 4px 16px rgba(120,157,188,0.3);
  }
  .cta-primary:active { transform: scale(0.97); }

  .cta-outline {
    padding: 15px 36px; border-radius: 5px;
    border: 2px solid #21243D;
    background: transparent; color: #21243D;
    font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
    transition: background 160ms var(--ease-out), color 160ms var(--ease-out), transform 160ms var(--ease-out);
  }
  .cta-outline:active { transform: scale(0.97); }

  .resume-btn {
    padding: 9px 22px; border-radius: 5px;
    background: #789DBC; color: #fff;
    text-decoration: none; font-size: 14px; font-weight: 700;
    transition: background 160ms var(--ease-out), transform 160ms var(--ease-out);
    font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
  }
  .resume-btn:active { transform: scale(0.97); }

  .lang-btn {
    padding: 7px 16px; border-radius: 20px;
    border: 1.5px solid rgba(33,36,61,0.25);
    background: transparent; color: #21243D;
    font-size: 13.5px; font-weight: 700; cursor: pointer;
    font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
    transition: border-color 160ms var(--ease-out), color 160ms var(--ease-out), transform 160ms var(--ease-out);
  }
  .lang-btn:active { transform: scale(0.95); }

  @keyframes cursorBlink { 50% { opacity: 0; } }
  .type-cursor {
    animation: cursorBlink 1s steps(1) infinite;
    font-weight: 400;
    margin-left: 2px;
  }

  .social-link {
    font-size: 14.5px; color: #637387; font-weight: 600;
    text-decoration: none; transition: color 160ms var(--ease-out), transform 160ms var(--ease-out);

  .social-link:active { transform: scale(0.97); }

  .brand-icon.modal-icon img {
    max-width: 58px;
    max-height: 48px;

  /* Section label */
  .sec-label {
    font-size: 15px; font-weight: 800; color: #789DBC;
    letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 10px;

  .sec-title {
    font-size: 42px; font-weight: 900; color: #21243D;
    letter-spacing: 0; margin-bottom: 24px;

  @media (hover: hover) and (pointer: fine) {
    .nav-btn:hover { color: #789DBC; }

      box-shadow: 0 16px 44px rgba(33,36,61,0.14);

    .cta-outline:hover { background: #21243D; color: #fff; }
    .resume-btn:hover { background: #6a8aab; transform: translateY(-1px); }
    .lang-btn:hover { border-color: #789DBC; color: #789DBC; }
    .social-link:hover { color: #21243D; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
      scroll-behavior: auto !important;
    }
    .reveal {
      opacity: 1;
      transform: none;
    }
  }

  @media (max-width: 900px) {
    .hero-inner { flex-direction: column-reverse !important; text-align: center; gap: 32px !important; }
    .hero-avatar { width: 240px !important; height: 240px !important; margin: 0 auto; }

    .hero-avatar > div:first-child { width: 220px !important; height: 220px !important; }
    .hero-avatar > div:last-child  { width: 220px !important; height: 220px !important; }
    .hero-cta, .hero-social { justify-content: center !important; }
    .nav-links { display: none !important; }
    .sec-inner { padding: 0 24px !important; }
    .hero-name { font-size: 44px !important; }
    .sec-title { font-size: 30px !important; }
    .sec-title + p { display: none; }
    footer { padding: 24px !important; flex-direction: column !important; gap: 12px; }
    .footer-links { display: none !important; }
    .featured-card { flex: 1 1 100% !important; }
    .exp-row { flex-wrap: wrap; }
  }

function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
}

function Tag({ label, dark }) {
  return <span className={`tag${dark ? " dark" : ""}`}>{label}</span>;
}

function Typewriter({ words }) {
  const [idx, setIdx] = useState(0);
  const [len, setLen] = useState(0);
  const [deleting, setDeleting] = useState(false);

  // Reset when the word list changes (e.g. language toggle)
  useEffect(() => { setIdx(0); setLen(0); setDeleting(false); }, [words]);

  useEffect(() => {
    const word = words[idx % words.length];
    let delay = deleting ? 45 : 95;                    // deleting is faster than typing
    if (!deleting && len === word.length) delay = 1800; // pause on the full word
    else if (deleting && len === 0) delay = 400;        // brief pause before next word
    const tmo = setTimeout(() => {
      if (!deleting && len === word.length) setDeleting(true);
      else if (deleting && len === 0) { setDeleting(false); setIdx(i => (i + 1) % words.length); }
      else setLen(l => l + (deleting ? -1 : 1));
    }, delay);
    return () => clearTimeout(tmo);
  }, [len, deleting, idx, words]);

  const word = words[idx % words.length];
  return <span>{word.slice(0, len)}<span className="type-cursor">|</span></span>;
}

              {bullets.map((b, i) => <li key={i} style={{ fontSize: 15.5, color: C.navy, lineHeight: 1.65, opacity: 0.86 }}>{b}</li>)}
            </ul>
          </>
        )}
        <div style={{ display: "flex", gap: 12, marginTop: 28 }}>
          {item.github && <a href={item.github} target="_blank" rel="noreferrer" style={{ padding: "12px 24px", borderRadius: 6, background: C.navy, color: C.white, textDecoration: "none", fontSize: 15, fontWeight: 700 }}>GitHub ↗</a>}
          {item.demo && <a href={item.demo} target="_blank" rel="noreferrer" style={{ padding: "12px 24px", borderRadius: 6, background: C.blue, color: C.white, textDecoration: "none", fontSize: 15, fontWeight: 700 }}>Live Demo ↗</a>}
        </div>
      </div>
    </div>
  );
}

// ─── Main ─────────────────────────────────────────────────────────────────────
function Portfolio() {
  const [selected, setSelected] = useState(null);
  const [navScrolled, setNavScrolled] = useState(false);
  const [lang, setLang] = useState(() => {
    try {
      return localStorage.getItem("lang") || (navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en");
    } catch (e) { return "en"; }
  });
  const S = STR[lang];
  const titles = tx(PROFILE.titles, lang);
  useReveal();

  useEffect(() => {
    try { localStorage.setItem("lang", lang); } catch (e) {}
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
    document.title = lang === "zh" ? "Nicole 的作品集" : "Nicole's Portfolio";
  }, [lang]);

  useEffect(() => {
    // Scroll progress
    const onScroll = () => {
      const doc = document.documentElement;
      const pct = (window.scrollY / (doc.scrollHeight - doc.clientHeight)) * 100;
      const bar = document.getElementById("scroll-progress");
      if (bar) bar.style.width = pct + "%";
      setNavScrolled(window.scrollY > 20);
    };
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const scrollTo = id => {
    const el = document.getElementById(id);
    if (!el) return;
    const y = el.getBoundingClientRect().top + window.scrollY - 80;
    window.scrollTo({ top: y, behavior: "smooth" });
  };

  const navLinks = [
    { label: S.nav.about,      id: "about" },
    { label: S.nav.experience, id: "experience" },
    { label: S.nav.projects,   id: "projects" },
    { label: S.nav.skills,     id: "skills" },
    { label: S.nav.contact,    id: "contact" },
  ];

  return (
    <div style={{ fontFamily: "'DM Sans', 'Noto Sans TC', sans-serif", color: C.navy, background: C.white, minHeight: "100vh" }}>

      {/* NAVBAR */}
      <nav style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 100, background: navScrolled ? "rgba(255,255,255,0.92)" : "transparent", backdropFilter: navScrolled ? "blur(14px)" : "none", boxShadow: navScrolled ? "0 1px 24px rgba(33,36,61,0.08)" : "none", transition: "background 180ms cubic-bezier(0.23,1,0.32,1), box-shadow 180ms cubic-bezier(0.23,1,0.32,1), backdrop-filter 180ms cubic-bezier(0.23,1,0.32,1)", padding: "0 clamp(28px,5vw,88px)", height: 72, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })} style={{ fontWeight: 900, fontSize: 21, color: C.navy, cursor: "pointer", letterSpacing: "0" }}>
          Nicole<span style={{ color: C.blue }}>.</span>
        </span>
        <div style={{ display: "flex", gap: 20, alignItems: "center" }}>
          <div className="nav-links" style={{ display: "flex", gap: 36, alignItems: "center" }}>
            {navLinks.map(l => (
              <button key={l.id} className="nav-btn" onClick={() => scrollTo(l.id)}>{l.label}</button>
            ))}
            <a href={S.resumeFile} download className="resume-btn">{S.resume}</a>
          </div>
          <button className="lang-btn" onClick={() => setLang(lang === "en" ? "zh" : "en")} title={lang === "en" ? "切換至中文" : "Switch to English"}>
            {lang === "en" ? "中文" : "EN"}
          </button>
        </div>
      </nav>

      {/* HERO */}
      <section style={{ position: "relative", minHeight: "84vh", display: "flex", alignItems: "center", padding: "92px clamp(28px,5vw,88px) 36px", overflow: "hidden" }}>
        {/* Blobs */}
        <div className="hero-blob" style={{ width: 560, height: 560, background: "rgba(201,233,210,0.28)", top: -120, right: -80 }} />
        <div className="hero-blob" style={{ width: 360, height: 360, background: "rgba(255,227,227,0.3)", bottom: 40, left: -100 }} />

        <div className="hero-inner" style={{ maxWidth: 1280, margin: "0 auto", width: "100%", display: "flex", alignItems: "center", gap: 64, position: "relative", zIndex: 1 }}>
          {/* Left */}
          <div style={{ flex: "1 1 620px" }}>
            <p className="hero-in hero-in-1" style={{ margin: "0 0 10px", fontSize: 16, color: C.blue, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>{tx(PROFILE.greeting, lang)}</p>
            <h1 className="hero-name hero-in hero-in-2" style={{ margin: "0 0 10px", fontSize: 68, fontWeight: 900, color: C.navy, lineHeight: 1.02, letterSpacing: "0" }}>
              {tx(PROFILE.name, lang)}
            </h1>
            <div className="hero-in hero-in-3" style={{ margin: "0 0 22px", fontSize: 28, color: C.blue, fontWeight: 600, minHeight: "1.4em", fontFamily: "'DM Mono', 'Noto Sans TC', monospace" }}>
              <Typewriter words={titles} />
            </div>
            <p className="hero-in hero-in-3" style={{ margin: "0 0 30px", fontSize: 17, color: C.navy, lineHeight: 1.72, maxWidth: 600, opacity: 0.76 }}>{tx(PROFILE.bio, lang)}</p>
            <div className="hero-cta hero-in hero-in-4" style={{ display: "flex", gap: 16, marginBottom: 28, flexWrap: "wrap" }}>
              <button className="cta-primary" onClick={() => scrollTo("contact")}>{S.hireMe}</button>
              <button className="cta-outline" onClick={() => scrollTo("projects")}>{S.viewProjects}</button>
            </div>
            <div className="hero-social hero-in hero-in-5" style={{ display: "flex", gap: 28 }}>
              {[{ label: "GitHub ↗", href: PROFILE.github }, { label: "LinkedIn ↗", href: PROFILE.linkedin }, { label: "Email ↗", href: `mailto:${PROFILE.email}` }].map(s => (
                <a key={s.label} href={s.href} target="_blank" rel="noreferrer" className="social-link">{s.label}</a>
              ))}
            </div>
          </div>
          {/* Avatar */}
          <Avatar />
        </div>
      </section>

      {/* ABOUT */}
      <section id="about" style={{ padding: "64px 0", background: C.offWhite }}>
        <div className="sec-inner" style={{ maxWidth: 1280, margin: "0 auto", padding: "0 clamp(28px,5vw,88px)" }}>
          <p className="sec-label reveal">{S.aboutLabel}</p>
          <h2 className="sec-title reveal reveal-delay-1">{S.aboutTitle}</h2>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
            {EDUCATION.map((edu, i) => (
              <div key={edu.icon} className={`reveal reveal-delay-${i + 1}`} style={{ flex: "1 1 360px", background: C.white, borderRadius: 8, padding: 30, boxShadow: "0 2px 16px rgba(33,36,61,0.07)" }}>
                <SchoolIcon edu={edu} />
                <h3 style={{ margin: "0 0 5px", fontSize: 24, fontWeight: 800, color: C.navy }}>{tx(edu.school, lang)}</h3>
                <p style={{ margin: "0 0 5px", fontSize: 17, color: C.blue, fontWeight: 600 }}>{tx(edu.degree, lang)}</p>
                <p style={{ margin: "0 0 16px", fontSize: 15.5, color: C.gray }}>{edu.period} · {tx(edu.location, lang)}</p>
                <div>{tx(edu.courses, lang).map(c => <Tag key={c} label={c} />)}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* FEATURED */}
      <section style={{ background: C.pink, padding: "64px 0" }}>
        <div className="sec-inner" style={{ maxWidth: 1280, margin: "0 auto", padding: "0 clamp(28px,5vw,88px)" }}>
          <p className="sec-label reveal">{S.featuredLabel}</p>
          <h2 className="sec-title reveal reveal-delay-1">{S.featuredTitle}</h2>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
            {FEATURED.map((p, i) => (
              <div key={p.id} className={`featured-card reveal reveal-delay-${i + 1}`} onClick={() => setSelected(p)}>
                <div style={{ width: 62, height: 62, borderRadius: 12, background: p.color, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 32, marginBottom: 18 }}>{p.emoji}</div>
                <h3 style={{ margin: "0 0 5px", fontSize: 20, fontWeight: 700, color: C.navy }}>{tx(p.title, lang)}</h3>
                <p style={{ margin: "0 0 14px", fontSize: 13.5, color: C.gray }}>{tx(p.subtitle, lang)}</p>
                <p style={{ margin: "0 0 16px", fontSize: 15.5, color: C.navy, lineHeight: 1.58, opacity: 0.8 }}>{trunc(tx(p.description, lang), lang === "zh" ? 75 : 150)}</p>
                <div>{p.tags.map(t => <Tag key={t} label={t} />)}</div>
                <div style={{ marginTop: 18, fontSize: 14.5, color: C.blue, fontWeight: 700 }}>{S.viewDetails}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* EXPERIENCE */}
      <section id="experience" style={{ padding: "64px 0", background: C.white }}>
        <div className="sec-inner" style={{ maxWidth: 1280, margin: "0 auto", padding: "0 clamp(28px,5vw,88px)" }}>
          <p className="sec-label reveal">{S.expLabel}</p>
          <h2 className="sec-title reveal reveal-delay-1">{S.expTitle}</h2>
          <div>
            {EXPERIENCE.map((exp, i) => (
              <div key={exp.id} className={`exp-row reveal reveal-delay-${i + 1}`} onClick={() => setSelected(exp)}>
                <ItemIcon item={exp} />
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4, gap: 12 }}>
                    <div>
                      <h3 style={{ margin: 0, fontSize: 19, fontWeight: 700, color: C.navy }}>{tx(exp.role, lang)}</h3>
                      <p style={{ margin: "3px 0 0", fontSize: 15.5, color: C.blue, fontWeight: 600 }}>{tx(exp.company, lang)}</p>
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0 }}>
                      <p style={{ margin: 0, fontSize: 13.5, color: C.gray }}>{exp.period}</p>
                      <p style={{ margin: "3px 0 0", fontSize: 13.5, color: C.gray }}>{tx(exp.location, lang)}</p>
                    </div>
                  </div>
                  <p style={{ margin: "12px 0", fontSize: 15.5, color: C.navy, opacity: 0.78, lineHeight: 1.55 }}>{tx(exp.bullets, lang)[0]}</p>
                  <div>{exp.tags.map(t => <Tag key={t} label={t} dark />)}</div>
                </div>
                <div style={{ fontSize: 24, color: C.gray, alignSelf: "center" }}>›</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* MORE PROJECTS */}
      <section id="projects" style={{ padding: "64px 0", background: C.offWhite }}>
        <div className="sec-inner" style={{ maxWidth: 1280, margin: "0 auto", padding: "0 clamp(28px,5vw,88px)" }}>
          <p className="sec-label reveal">{S.workLabel}</p>
          <h2 className="sec-title reveal reveal-delay-1">{S.workTitle}</h2>
          <p className="reveal reveal-delay-1" style={{ margin: "-14px 0 24px", fontSize: 15.5, color: C.gray }}>{S.workHint}</p>
          <div>
            {PROJECTS.map((p, i) => (
              <div key={p.id} className={`proj-row reveal reveal-delay-${i + 1}`} onClick={() => setSelected(p)} style={{ borderBottom: i < PROJECTS.length - 1 ? "1px solid rgba(33,36,61,0.08)" : "none" }}>
                <div style={{ width: 62, height: 62, flexShrink: 0, borderRadius: 12, background: C.white, border: "1px solid rgba(33,36,61,0.09)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 30 }}>{p.emoji}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
                    <h3 style={{ margin: 0, fontSize: 19, fontWeight: 700, color: C.navy }}>{tx(p.title, lang)}</h3>
                    <span style={{ fontSize: 13.5, color: C.gray }}>{p.year}</span>
                  </div>
                  <p style={{ margin: "0 0 12px", fontSize: 15.5, color: C.gray, lineHeight: 1.55 }}>{trunc(tx(p.description, lang), lang === "zh" ? 82 : 165)}</p>
                  <div>{p.tags.map(t => <Tag key={t} label={t} dark />)}</div>
                </div>
                <div style={{ fontSize: 24, color: C.gray, alignSelf: "center" }}>›</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* SKILLS */}
      <section id="skills" style={{ padding: "64px 0", background: C.white }}>
        <div className="sec-inner" style={{ maxWidth: 1280, margin: "0 auto", padding: "0 clamp(28px,5vw,88px)" }}>
          <p className="sec-label reveal">{S.skillsLabel}</p>
          <h2 className="sec-title reveal reveal-delay-1">{S.skillsTitle}</h2>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 34 }}>
            {SKILLS.map((cat, ci) => (
              <div key={cat.label.en} className={`reveal reveal-delay-${ci + 1}`}>
                <h4 style={{ margin: "0 0 14px", fontSize: 13, fontWeight: 700, color: C.blue, textTransform: "uppercase", letterSpacing: "0.12em" }}>{tx(cat.label, lang)}</h4>
                {cat.items.map(s => (
                  <div key={s} className="skill-item" style={{ fontSize: 15.5, color: C.navy, padding: "10px 0", borderBottom: "1px solid rgba(33,36,61,0.07)", display: "flex", alignItems: "center", gap: 12, transition: "color 0.2s" }}>
                    <span className="skill-dot" />
                    {s}
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* CONTACT */}
      <section id="contact" style={{ background: C.pink, padding: "64px 0" }}>
        <div className="sec-inner" style={{ maxWidth: 1280, margin: "0 auto", padding: "0 clamp(28px,5vw,88px)" }}>
          <p className="sec-label reveal">{S.contactLabel}</p>
          <h2 className="sec-title reveal reveal-delay-1">{S.contactTitle}</h2>
          <p className="reveal reveal-delay-2" style={{ margin: "-14px 0 30px", fontSize: 17, color: C.navy, opacity: 0.76, maxWidth: 620, lineHeight: 1.65 }}>
            {S.contactBlurb}
          </p>
          <div className="reveal reveal-delay-3" style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
            {[
              { label: S.sayHello,    href: `mailto:${PROFILE.email}`, filled: true },
              { label: "LinkedIn ↗",  href: PROFILE.linkedin,          filled: false },
              { label: "GitHub ↗",    href: PROFILE.github,            filled: false },
            ].map(btn => (
              <a key={btn.label} href={btn.href} target="_blank" rel="noreferrer"
                className="contact-btn"
                style={{ background: btn.filled ? C.blue : "transparent", border: btn.filled ? "none" : `2px solid ${C.navy}`, color: btn.filled ? C.white : C.navy, boxShadow: btn.filled ? "0 4px 16px rgba(120,157,188,0.3)" : "none" }}
                onMouseEnter={e => {
                  if (btn.filled) { e.currentTarget.style.background = "#6a8aab"; e.currentTarget.style.transform = "translateY(-2px)"; }
                  else { e.currentTarget.style.background = C.navy; e.currentTarget.style.color = C.white; e.currentTarget.style.transform = "translateY(-2px)"; }
                }}
                onMouseLeave={e => {
                  e.currentTarget.style.background = btn.filled ? C.blue : "transparent";
                  e.currentTarget.style.color = btn.filled ? C.white : C.navy;
                  e.currentTarget.style.transform = "";
                }}
              >{btn.label}</a>
            ))}
          </div>
          {/* Contact info */}
          <div className="reveal reveal-delay-4" style={{ marginTop: 40, display: "flex", gap: 40, flexWrap: "wrap" }}>

              { label: S.locationLabel, value: PROFILE.location, href: null },
            ].map(info => (
              <div key={info.label}>
                <p style={{ margin: "0 0 5px", fontSize: 12, fontWeight: 700, color: C.blue, textTransform: "uppercase", letterSpacing: "0.1em" }}>{info.label}</p>

                  ? <a href={info.href} style={{ fontSize: 15.5, color: C.navy, fontWeight: 500, textDecoration: "none", opacity: 0.8 }}>{info.value}</a>

                }

            ))}
          </div>
        </div>
      </section>

      {/* FOOTER */}

          <span style={{ fontWeight: 900, fontSize: 20, color: C.white, letterSpacing: "0" }}>Nicole<span style={{ color: C.blue }}>.</span></span>
          <span style={{ fontSize: 14, color: "rgba(255,255,255,0.45)" }}>© {new Date().getFullYear()} Yu Yi (Nicole) Kuo · {PROFILE.location}</span>
        </div>
        <div className="footer-links" style={{ display: "flex", gap: 30 }}>
          {navLinks.map(l => (
            <button key={l.id} onClick={() => scrollTo(l.id)}
              style={{ background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "rgba(255,255,255,0.5)", padding: 0, fontFamily: "'DM Sans','Noto Sans TC',sans-serif", transition: "color 0.2s" }}
              onMouseEnter={e => e.currentTarget.style.color = C.white}
              onMouseLeave={e => e.currentTarget.style.color = "rgba(255,255,255,0.5)"}
            >{l.label}</button>
          ))}
        </div>
      </footer>

      {selected && <Modal item={selected} lang={lang} S={S} onClose={() => setSelected(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Portfolio />);
</script>
